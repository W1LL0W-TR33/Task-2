<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GET Form Experiment</title>
</head>

  <h1>GET Form Experiment</h1>

  <p>This form demonstrates browser behavior; it does not send a real message.</p>

  <form method="GET">
    <p>
      <label for="name">Your name</label>
      <input type="text" id="name" name="name">
    </p>

    <p>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" cols="30"></textarea>
    </p>

    <input type="submit" value="Show values in the URL">
  </form>

</html>
